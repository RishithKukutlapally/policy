[project]
name = "policyforge-backend"
version = "0.1.0"
description = "PolicyForge — policy issuance and lifecycle management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jsonschema>=4.22",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["alembic.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing"
markers = [
    "ac(id): acceptance criterion this test proves, e.g. @pytest.mark.ac(\"AC-21\")",
    "integration: test that touches the database, filesystem or a subprocess",
    "architecture: structural/architecture guard test",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (types > domain > config > repository > service > api)"
type = "layers"
layers = [
    "src.api",
    "src.service",
    "src.repository",
    "src.config",
    "src.domain",
    "src.types",
]

[[tool.importlinter.contracts]]
name = "API goes through services (no repository or domain imports)"
type = "forbidden"
source_modules = ["src.api"]
forbidden_modules = ["src.repository", "src.domain"]
# Routers may call a service that itself uses repositories (the layered contract above still
# forbids the reverse direction); what is banned is a *direct* import from `src.api`.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Repository depends on types and config only (no domain)"
type = "forbidden"
source_modules = ["src.repository"]
forbidden_modules = ["src.domain"]

[[tool.importlinter.contracts]]
name = "lib is standard library only (no src.* layer imports)"
type = "forbidden"
source_modules = ["src.lib"]
forbidden_modules = [
    "src.types",
    "src.domain",
    "src.config",
    "src.repository",
    "src.service",
    "src.api",
]

[[tool.importlinter.contracts]]
name = "types and domain stay pure (no framework, logging or lib)"
type = "forbidden"
source_modules = ["src.types", "src.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx", "logging", "src.lib"]
